<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码验证码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 { color: #ffffff; font-size: 24px; font-weight: 600; }
        .content { padding: 30px 20px; }
        .greeting { color: #333333; font-size: 16px; margin-bottom: 20px; line-height: 1.6; }
        .otp-box {
            background-color: #f8f9fa;
            border: 2px dashed #ff6b6b;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .otp-label { color: #666666; font-size: 14px; margin-bottom: 10px; }
        .otp-code { color: #ff6b6b; font-size: 32px; font-weight: bold; letter-spacing: 8px; }
        .tip { color: #999999; font-size: 14px; line-height: 1.6; margin-top: 20px; }
        .warning {
            color: #ff4d4f;
            font-size: 13px;
            margin-top: 15px;
            padding: 10px;
            background-color: #fff2f0;
            border-radius: 4px;
            border-left: 3px solid #ff4d4f;
        }
        .footer {
            background-color: #fafafa;
            padding: 20px;
            text-align: center;
            color: #999999;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔐 找回密码</h1>
    </div>
    <div class="content">
        <p class="greeting">
            您好，您正在进行找回密码操作！<br>
            请使用以下验证码验证您的身份：
        </p>

        <div class="otp-box">
            <div class="otp-label">验证码</div>
            <div class="otp-code" th:text="${code}"></div>
        </div>

        <p class="tip">
            验证码有效期为 <strong>5 分钟</strong>，请尽快完成验证。<br>
            如果您没有发起找回密码请求，请忽略此邮件。
        </p>

        <div class="warning">
            ⚠️ 温馨提示：请勿将验证码泄露给他人，任何人索取验证码均属诈骗行为。
        </div>
    </div>
    <div class="footer">
        <p>此邮件由系统自动发送，请勿回复</p>
        <p>© 2026 TourWo Trip. All rights reserved.</p>
    </div>
</div>
</body>
</html>
