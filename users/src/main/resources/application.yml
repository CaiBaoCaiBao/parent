server:
  port: 8001
spring:
  application:
    name: users
  config:
    import: optional:nacos:${spring.application.name}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848	#注册中心地址
    openfeign:
      client:
        default-config: default
  datasource:
    url: jdbc:postgresql://localhost:5432/trip
    username: postgres
    password: '040210'
    driver-class-name: org.postgresql.Driver
    # 推荐使用HikariCP连接池
    type: com.zaxxer.hikari.HikariDataSource

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

jwt:
  private-key-path: classpath:private.pem
  public-key-path: classpath:public.pem
  access-expiration: 2*60*60*1000 # 过期时间：2小时，单位毫秒
  iss: 2240709249

logging:
  config: classpath:users-logback.xml
  level:
    root: info
    users: debug

users:
  service:
    name: users
    context-id: users-service
